[Service]
# Live mode: sell without a prompt. Install this file as
#   /etc/systemd/system/stonks-sell.service.d/override.conf
# then run: systemctl daemon-reload
# Delete that file and reload to return to the dry run in stonks-sell.service.
ExecStart=
ExecStart=/root/gitclones/stonks/.venv/bin/stonks sell --take-profit 10 --execute --yes
