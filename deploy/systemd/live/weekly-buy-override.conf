[Service]
# Live mode: buy without a prompt. Install this file as
#   /etc/systemd/system/stonks-weekly-buy.service.d/override.conf
# then run: systemctl daemon-reload
# Delete that file and reload to return to the dry run in stonks-weekly-buy.service.
ExecStart=
ExecStart=/root/gitclones/stonks/.venv/bin/stonks rebuy --pick /root/gitclones/stonks-opt/data/tuesday_pick.json --execute --yes
