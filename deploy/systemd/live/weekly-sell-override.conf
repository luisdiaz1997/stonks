[Service]
# Live mode: sell everything without a prompt. Install this file as
#   /etc/systemd/system/stonks-weekly-sell.service.d/override.conf
# then run: systemctl daemon-reload
# Delete that file and reload to return to the dry run in stonks-weekly-sell.service.
ExecStart=
ExecStart=/root/gitclones/stonks/.venv/bin/stonks sell --everything --execute --yes
